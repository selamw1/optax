# Install the pre-commit hooks below with
# 'pre-commit install'

# Auto-update the version of the hooks with
# 'pre-commit autoupdate'

# Run the hooks on all files with
# 'pre-commit run --all'

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-ast
  - id: check-merge-conflict
  - id: check-toml
  - id: check-yaml
  - id: end-of-file-fixer
    files: \.(py|md)$
    exclude: ^\.github/notebook-reviews/  # generated by notebook-previews
  - id: trailing-whitespace
    files: \.(py|md|ipynb)$
    exclude: ^\.github/notebook-reviews/  # generated by notebook-previews
  - id: debug-statements
    files: \.py$  # only include python files
  - id: mixed-line-ending  # remove CR
    args: [--fix=lf]

- repo: local
  hooks:
  - id: check-license
    name: Check license headers
    entry: python ./.github/check_license_headers.py
    language: python
    pass_filenames: false  # only run this check once globally per repo
    always_run: true
  - id: notebook-previews
    name: Sync Markdown previews of notebooks
    entry: python ./.github/sync_notebook_previews.py
    language: python
    additional_dependencies: [jupytext==1.17.3]
    pass_filenames: false  # regenerates all previews, prunes stale ones
    always_run: true  # also catches deleted and renamed notebooks

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.9.10
  hooks:
  - id: ruff
